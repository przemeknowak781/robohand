<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoboHand — tendon-driven hand simulator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦾</text></svg>" />
    <style>
      :root {
        --bg: #0d1117;
        --panel: rgba(16, 22, 30, 0.88);
        --text: #d7dde5;
        --dim: #7d8794;
        --accent: #4ea1ff;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: var(--bg); color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }

      #hud {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        background: var(--panel); border: 1px solid #2a3442; border-radius: 8px;
        padding: 10px 12px; min-width: 265px;
        font-size: 12px; backdrop-filter: blur(4px);
        max-height: calc(100vh - 220px); overflow-y: auto;
      }
      #hud h1 { font-size: 13px; margin: 0 0 2px 0; color: var(--accent); letter-spacing: 0.5px; }
      #hud .sub { color: var(--dim); margin-bottom: 8px; font-size: 11px; }
      #tension-table { width: 100%; border-collapse: collapse; }
      #tension-table td { padding: 1px 4px 1px 0; white-space: nowrap; }
      #tension-table td.val { text-align: right; font-variant-numeric: tabular-nums; min-width: 52px; }
      .bar-cell { width: 90px; }
      .bar { height: 7px; border-radius: 3px; background: #232c38; overflow: hidden; }
      .bar > i { display: block; height: 100%; width: 0%; background: var(--accent); border-radius: 3px; }

      #plot-wrap {
        position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 10;
        background: var(--panel); border: 1px solid #2a3442; border-radius: 8px;
        padding: 8px 10px 6px 10px; backdrop-filter: blur(4px);
      }
      #plot-wrap .plot-title { font-size: 11px; color: var(--dim); margin-bottom: 4px; }
      #plot { width: 100%; height: 130px; display: block; }

      #status {
        position: fixed; bottom: 170px; left: 12px; z-index: 10;
        color: var(--dim); font-size: 11px;
        background: var(--panel); border: 1px solid #2a3442; border-radius: 6px;
        padding: 4px 8px;
      }
      .lil-gui { --width: 320px; max-height: calc(100vh - 40px); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <h1>RoboHand</h1>
      <div class="sub">tendon tensions [N]</div>
      <table id="tension-table"></table>
    </div>
    <div id="status"></div>
    <div id="plot-wrap">
      <div class="plot-title">Tendon tension history [N] — last <span id="plot-window">8</span> s</div>
      <canvas id="plot"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
